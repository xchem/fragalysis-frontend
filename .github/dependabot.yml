---
# Dependabot configuration (issue #561).
#
# Dependabot reads this file only from the default branch ('staging').
#
# Version updates go to the 'security' branch, a patch branch of 'production'.
# The 'dependabot auto-merge' workflow merges the pull requests that fix an
# open alert at or above a minimum severity. See the "Security patches"
# section of README.md for the release flow.
#
# Note: GitHub ignores 'target-branch' for Dependabot *security* updates.
# Those always target the default branch.

version: 2

updates:

- package-ecosystem: npm
  # The Yarn package.json and yarn.lock
  directory: /
  target-branch: security
  schedule:
    interval: daily
  open-pull-requests-limit: 10

- package-ecosystem: docker
  directory: /
  target-branch: security
  schedule:
    interval: daily
  # 'security' is a patch branch of 'production'. Accept only patch versions
  # of the Node base image (e.g. 24.22.x). A new Node minor or major version
  # is a planned change on 'staging', not a patch.
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
    - version-update:semver-minor

- package-ecosystem: github-actions
  directory: /
  target-branch: security
  schedule:
    interval: weekly
